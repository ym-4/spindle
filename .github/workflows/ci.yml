name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug checkout
        run: |
          echo "HEAD:"
          git rev-parse HEAD
          echo
          git log --oneline -1
          echo
          git status
          echo
          nl -ba src/public/marketplace.html | sed -n '60,90p'

      - name: Install dependencies
        run: npm install

      - name: Prettier check
        run: npm run format-check

      - name: ESLint
        run: npm run lint

      - name: Jest tests
        run: npm test
