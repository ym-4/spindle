name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug checkout
        run: |
          git rev-parse HEAD
          git branch -a
          git log --oneline -1
          echo "===== marketplace.html ====="
          sed -n '60,90p' src/public/marketplace.html

      - name: Install dependencies
        run: npm install

      - name: Debug marketplace
        run: |
          pwd
          node -v
          npx prettier --version
          echo "==== FILE ===="
          cat -n src/public/marketplace.html | sed -n '65,85p'

      - name: Prettier check
        run: npm run format-check

      - name: ESLint
        run: npm run lint

      - name: Jest tests
        run: npm test
