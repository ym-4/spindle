<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="css/whiteboard.css" />
    <script src="js/queryCmds.js"></script>
    <script src="js/whiteboard.js" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <!-- Mode -->
      <div class="group">
        <button id="whiteboardBtn" class="active-mode">📝 Whiteboard</button>
        <button id="pixelBtn">🎨 Pixel Art</button>
      </div>

      <!-- Drawing -->
      <div class="group">
        <div class="control">
          <label>Tool</label>
          <select id="shapeTool">
            <option value="freehand">Freehand</option>
            <option value="line">Line</option>
            <option value="rectangle">Rectangle</option>
            <option value="circle">Circle</option>
          </select>
        </div>

        <div class="control">
          <label>Brush</label>
          <select id="brushTool">
            <option value="pen">Pen</option>
            <option value="marker">Marker</option>
            <option value="pencil">Pencil</option>
          </select>
        </div>

        <div class="control">
          <label>Color</label>
          <input type="color" id="stroke" />
        </div>

        <div class="control">
          <label>Size</label>
          <input type="range" id="lineWidth" min="1" max="50" value="5" />
        </div>

        <div class="control">
          <label>Opacity</label>
          <input type="range" id="opacity" min="0" max="1" step="0.05" value="1" />
        </div>
      </div>

      <!-- Edit -->
      <div class="group">
        <button id="undo">↶</button>
        <button id="redo">↷</button>
        <button id="eraser">🩹</button>
        <button id="clear">🗑</button>
      </div>

      <!-- View -->
      <div class="group">
        <button id="zoomOut">−</button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn">+</button>
      </div>

      <!-- File -->
      <div class="group right">
        <button id="save">💾 Save</button>
        <button id="fullscreen">⛶</button>
      </div>
    </div>

    <div id="canvasContainer">
      <canvas id="drawing-board"></canvas>
      <canvas id="pixel-board" style="display: none"></canvas>
    </div>
  </body>
</html>
