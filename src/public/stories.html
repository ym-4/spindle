<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status — Spindle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link rel="stylesheet" href="css/wa.css" />
    <script src="js/api.js"></script>
  </head>
  <body data-page="stories">
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-search">
          <input class="form-control" type="search" placeholder="Search posts, groups, items..." aria-label="Search">
        </div>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton"><i class="fas fa-user-circle"></i> Profile</a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>

      <main class="content-area">
        <h1 class="h4 mb-3"><i class="fas fa-circle me-2" style="color:var(--primary-color);"></i>Status</h1>

        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">Add to your status</h5>
            <p class="text-muted small">Friends see this for 24 hours.</p>
            <form id="storyForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Photo</label>
                <input type="file" id="storyFile" class="form-control" accept="image/*" required />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Caption</label>
                <input type="text" id="storyCaption" class="form-control" maxlength="200" placeholder="What's happening?" />
              </div>
              <button type="submit" class="btn btn-primary">Post status</button>
            </form>
          </div>
        </div>

        <div id="storiesGrid" class="row g-3"></div>
        <p id="storiesEmpty" class="text-muted text-center py-5 hidden">No status updates yet.</p>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/queryCmds.js"></script>
    <script src="js/getCurrentURL.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/page-guard.js" data-require-login defer></script>
    <script src="js/stories.js"></script>
  </body>
</html>
