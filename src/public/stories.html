<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status — Spindle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/wa.css" />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <script src="js/api.js"></script>
    <script src="js/page-guard.js" data-require-login data-return="stories.html"></script>
  </head>
  <body data-page="stories">
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>
      <main class="content-area" style="flex:1;overflow-y:auto;padding:2rem;">
        <h1 class="h4 mb-3">Status</h1>
        <p class="text-muted small">Share what's happening — friends see this for 24 hours.</p>

        <div class="card mb-4 shadow-sm" style="max-width:500px;">
          <div class="card-body">
            <form id="storyForm">
              <div class="mb-2">
                <label class="form-label small fw-semibold">Photo</label>
                <input type="file" id="storyFile" accept="image/*" class="form-control form-control-sm" required />
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Caption</label>
                <input type="text" id="storyCaption" maxlength="200" class="form-control form-control-sm" placeholder="What's happening?" />
              </div>
              <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-plus-circle me-1"></i>Post status</button>
            </form>
          </div>
        </div>

        <div id="storiesGrid" class="row g-3"></div>
        <p id="storiesEmpty" class="text-muted text-center py-4 hidden">No status updates yet. Post one above!</p>
      </main>
    </div>

    <script src="js/wa-nav.js"></script>
    <script src="js/queryCmds.js"></script>
    <script src="js/getCurrentURL.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stories.js"></script>
  </body>
</html>
