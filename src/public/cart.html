<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/posts.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/marketplace.css">
    <title>Cart</title>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid px-4 d-flex align-items-center">
        <!-- Brand (left) -->
        <a class="navbar-brand" href="index.html">
            <img src="" alt="Spindle Logo" class="brand-logo" />
            <span class="brand-name">spindle</span>
        </a>

        <div class="navbar-right">
            <!-- Back to Marktetplace -->
            <a href="marketplace.html" class="btn-navbar-login">Back</a>

            <!-- View My Listings -->
            <a href="my-listings.html" class="btn-navbar-login">My Listings</a>

            <!-- Login + Sign Up displayed (no token)-->
            <a href="login.html" class="btn-navbar-login d-none" id="loginButton">Log In</a>
            <a href="register.html" class="btn-navbar-signup d-none" id="registerButton"
            >Sign Up</a
            >

            <!-- Profile + Logout displayed (token)-->
            <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
            </a>
            <button class="btn-navbar-logout d-none" id="logoutButton">Log Out</button>
        </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-dark py-5">
      <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
          <h1 class="display-4 fw-bolder">Your Cart</h1>
          <p class="lead fw-normal text-white-50 mb-0">Review your items before checking out</p>
        </div>
      </div>
    </header>

    <!-- Cart Section -->
    <section class="py-5">
      <div class="container px-4 px-lg-5">
        <div class="row">

          <!-- Cart Items -->
          <div class="col-lg-8">
            <div class="cart-container"></div>
          </div>

          <!-- Order Summary -->
          <div class="col-lg-4">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title fw-bolder mb-4">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                  <span>Subtotal</span>
                  <span id="subtotal">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span>Shipping</span>
                  <span>Free</span>
                </div>
                <hr />
                <div class="d-flex justify-content-between fw-bolder mb-4">
                  <span>Total</span>
                  <span id="total">$0.00</span>
                </div>
                <button class="btn btn-dark w-100">Proceed to Checkout</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-dark">
      <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Your Website 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavBarToggle.js" type="text/javascript"></script>
    <script src="js/insertMarketplaceItems.js" type="text/javascript"></script>
  </body>
</html>
