<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/spindle-notif.css">
    <link rel="stylesheet" href="css/wa.css">
    <script src="js/api.js"></script>
    <title>Cart</title>
  </head>
  <body data-page="marketplace">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
            <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
            <span class="brand-name">spindle</span>
        </a>

        <div class="navbar-right">
            <a href="marketplace.html" class="btn-navbar-login">Back</a>
            <a href="my_listings.html" class="btn-navbar-login">My Listings</a>
            <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
            <a href="home.html?login=1&return=cart.html" class="btn-navbar-login d-none" id="loginButton">Log In</a>
            <a href="home.html?login=1&return=cart.html" class="btn-navbar-signup d-none" id="registerButton">Sign Up</a>
            <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
            </a>
            <button class="btn-navbar-logout d-none" id="logoutButton">Log Out</button>
        </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
      <aside class="sidebar">
        <div id="yourGroupsContainer"></div>
      </aside>
      <main id="content-area">
        <header class="bg-dark py-5">
          <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
              <h1 class="display-4 fw-bolder">Your Cart</h1>
              <p class="lead fw-normal text-white-50 mb-0">Review your items before checking out</p>
            </div>
          </div>
        </header>

        <section class="py-5">
          <div class="container px-4 px-lg-5">
            <div class="row">
              <div class="col-lg-8">
                <div class="cart-container"></div>
              </div>

              <div class="col-lg-4">
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title fw-bolder mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                      <span>Subtotal</span>
                      <span id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                      <span>Shipping</span>
                      <span>Free</span>
                    </div>
                    <hr />
                    <div class="d-flex justify-content-between fw-bolder mb-4">
                      <span>Total</span>
                      <span id="total">$0.00</span>
                    </div>
                    <button class="btn btn-dark w-100 checkout-btn">Proceed to Checkout</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <footer class="py-5 bg-dark">
          <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; Spindle 2026</p>
          </div>
        </footer>
      </main>
    </div>

    <!-- Cart Edit Modal -->
    <div class="modal fade" id="editCartModal" tabindex="-1" aria-labelledby="editCartModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editCartModalLabel">Edit Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="editQuantity" class="form-label">Quantity</label>
              <input type="number" class="form-control" id="editQuantity" min="1" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="editSaveBtn">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
    <script src="js/page-guard.js" data-require-login data-return="cart.html" defer></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavBarToggle.js" type="text/javascript"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/cartFunctions.js"></script>
    <script src="js/insertMarketplaceItems.js"></script>
  </body>
</html>
