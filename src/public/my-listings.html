<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/spindle-notif.css">
    <link rel="stylesheet" href="css/wa.css">
    <script src="js/api.js"></script>
    <title>Marketplace - Your Listings</title>
  </head>
  <body data-page="marketplace">
    <!-- Navigation-->
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <!-- Brand (left) -->
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>

        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="cart.html" class="btn-navbar-login">View Cart</a>
          <a href="marketplace.html" class="btn-navbar-login">Back</a>
          <a href="home.html?login=1&return=my-listings.html" class="btn-navbar-login d-none" id="loginButton">Log In</a>
          <a href="home.html?login=1&return=my-listings.html" class="btn-navbar-signup d-none" id="registerButton">Sign Up</a>
          <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout d-none" id="logoutButton">Log Out</button>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
      <aside class="sidebar">
        <div id="yourGroupsContainer"></div>
      </aside>
      <main id="content-area">
        <header class="bg-dark py-5">
          <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
              <h1 class="display-4 fw-bolder">Your Listings</h1>
              <p class="lead fw-normal text-white-50 mb-0">Watchya sellin' ?</p>
            </div>
          </div>
        </header>
        <section class="py-5">
          <div class="container px-4 px-lg-5 mt-5">
            <div id="listings-container" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center"></div>
          </div>
        </section>
        <footer class="py-5 bg-dark">
          <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; Spindle 2026</p>
          </div>
        </footer>
      </main>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addedToCartModal" tabindex="-1" role="dialog" aria-labelledby="addedToCartModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addedToCartModalLabel">Item Added to Cart Successfully!</h5>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/page-guard.js" data-require-login data-return="my-listings.html" defer></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavBarToggle.js" type="text/javascript"></script>
    <script src="js/insertMarketplaceItems.js" type="text/javascript"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/spindle-sidebar.js"></script>
  </body>
</html>
