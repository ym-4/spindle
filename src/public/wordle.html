<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spindle Wordle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/wordle.css">
</head>
<body>

<div class="wordle-page">

  <header class="wordle-header">
    <div class="wordle-wordmark">
      <span class="spool-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <circle cx="20" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="20" cy="32" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <line x1="20" y1="14" x2="20" y2="26" stroke="currentColor" stroke-width="2.5"/>
          <path d="M20 14 Q28 20 20 26" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
          <path d="M20 14 Q12 20 20 26" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
        </svg>
      </span>
      <h1>Spindle Wordle</h1>
    </div>
    <p class="wordle-subtitle">Guess the 5-letter word in 6 tries &mdash; a fresh word every 7 days, on the house.</p>
    <div class="stitch-rule" aria-hidden="true"></div>
  </header>

  <main class="wordle-main">

    <div id="wordle-message" class="wordle-message" role="status" aria-live="polite"></div>

    <div id="wordle-board" class="wordle-board" aria-label="Wordle board"></div>

    <div id="wordle-keyboard" class="wordle-keyboard" aria-label="On-screen keyboard"></div>

    <div class="wordle-reward-strip">
      <span class="lock-icon" aria-hidden="true">&#128274;</span>
      <span>Win to unlock a marketplace discount code &mdash; one play every 7 days</span>
    </div>

  </main>

  <!-- Result modal -->
  <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content wordle-modal-content">
        <div class="modal-body text-center">
          <div id="resultIcon" class="result-icon"></div>
          <h2 id="resultTitle" class="result-title"></h2>
          <p id="resultBody" class="result-body"></p>
          <button type="button" class="btn wordle-btn-primary" id="resultCloseBtn" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/wordle.js"></script>
</body>
</html>
