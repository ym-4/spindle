<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Wordle</title>
    <link rel="stylesheet" href="css/theme.css" />

    <!-- CSS -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/temp.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link rel="stylesheet" href="css/wordle.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/wa-nav.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        updateNavForUser(getStoredUser());
        syncLegacyNavbar();
      });
    </script>
  </head>

  <body class="" data-page="wordle">
    <!-- Navigation-->
    <nav class="navbar">
      <div class="container-fluid px-4 d-flex align-items-center">
        <!-- Brand (left) -->
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>

        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
        <div>
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a
            href="home.html?login=1&tab=login&return=wordle.html"
            class="btn-navbar-login"
            id="loginButton"
            >Log In</a
          >
          <a
            href="home.html?login=1&tab=register&return=wordle.html"
            class="btn-navbar-signup"
            id="registerButton"
            >Sign Up</a
          >
          <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout d-none" id="logoutButton" type="button">Log Out</button>
        </div>
        <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
        <a
          href="home.html?login=1&tab=login&return=wordle.html"
          class="btn-navbar-login"
          id="loginButton"
          >Log In</a
        >
        <a
          href="home.html?login=1&tab=register&return=wordle.html"
          class="btn-navbar-signup"
          id="registerButton"
          >Sign Up</a
        >
        <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
          <i class="fas fa-user-circle"></i> Profile
        </a>
        <button class="btn-navbar-logout d-none" id="logoutButton" type="button">Log Out</button>
      </div>
      <a href="marketplace.html" class="btn-navbar-login">
        <i class="fas fa-arrow-left"></i> Back to Marketplace
      </a>
      <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
      <a
        href="home.html?login=1&tab=login&return=wordle.html"
        class="btn-navbar-login"
        id="loginButton"
        >Log In</a
      >
      <a
        href="home.html?login=1&tab=register&return=wordle.html"
        class="btn-navbar-signup"
        id="registerButton"
        >Sign Up</a
      >
      <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
        <i class="fas fa-user-circle"></i> Profile
      </a>
      <button class="btn-navbar-logout d-none" id="logoutButton" type="button">Log Out</button>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Left Sidebar -->
      <aside class="sidebar"></aside>

      <main id="content-area">
        <!-- Header -->
        <header class="py-5" id="wordle-header">
          <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
              <span class="spool-icon" aria-hidden="true">
                <svg viewBox="0 0 40 40" width="30" height="30">
                  <circle cx="20" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
                  <circle cx="20" cy="32" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
                  <line x1="20" y1="14" x2="20" y2="26" stroke="currentColor" stroke-width="2.5"/>
                  <path d="M20 14 Q28 20 20 26" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
                  <path d="M20 14 Q12 20 20 26" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
                </svg>
              </span>
              <h1 class="display-4 fw-bolder">Spindle Wordle</h1>
              <p class="lead fw-normal text-white-50 mb-0">
                Guess the 5-letter word in 6 tries &mdash; a fresh word every 7 days, on the house.
              </p>
            </div>
          </div>
        </header>

        <!-- Section -->
        <section class="py-5">
          <div class="container px-4 px-lg-5 mt-5 d-flex justify-content-center">
            <div class="wordle-card">
              <div id="wordle-message" class="wordle-message" role="status" aria-live="polite"></div>

              <div id="wordle-board" class="wordle-board" aria-label="Wordle board"></div>

              <div id="wordle-keyboard" class="wordle-keyboard" aria-label="On-screen keyboard"></div>

              <div class="wordle-reward-strip">
                <i class="fas fa-lock" aria-hidden="true"></i>
                <span>Win to unlock a marketplace discount code &mdash; one play every 7 days</span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Result modal -->
    <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center">
            <div id="resultIcon" class="result-icon"></div>
            <h2 id="resultTitle" class="result-title"></h2>
            <p id="resultBody" class="result-body"></p>
            <button type="button" class="btn btn-outline-dark" id="resultCloseBtn" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/api.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/wordle.js" type="text/javascript"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (typeof injectNotificationsOnly === 'function') {
          injectNotificationsOnly('spindleNotifSlot');
        }
      });
    </script>
  </body>
</html>
