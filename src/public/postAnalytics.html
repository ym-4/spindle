<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Analytics — Spindle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/profile-page.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <script src="js/api.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>

      <main class="content-area content-area--full" id="analyticsContent">
        <div class="mb-3">
          <a href="profile.html" class="btn btn-link text-decoration-none px-0">
            <i class="fas fa-arrow-left me-1"></i>Back to profile
          </a>
        </div>

        <div id="analyticsLoading" class="text-center py-5">
          <div class="spinner-border text-danger" role="status"></div>
          <p class="mt-2 text-muted">Loading analytics…</p>
        </div>

        <div id="analyticsRoot" class="d-none"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/postAnalytics.js"></script>
  </body>
</html>
