<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Spindle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/posts.css">
    <link rel="stylesheet" href="css/temp.css">
    <link rel="stylesheet" href="css/spindle-notif.css">
    <link rel="stylesheet" href="css/wa.css">
    <script src="js/api.js"></script>
    <script src="js/page-guard.js" data-require-login data-return="marketplace.html"></script>
</head>
<body data-page="marketplace">
    <!-- Navigation-->
    <nav class="navbar">
        <div class="container-fluid px-4 d-flex align-items-center">
            <!-- Brand (left) -->
            <a class="navbar-brand" href="index.html">
                <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
                <span class="brand-name">spindle</span>
            </a>

            <div class="navbar-right">
                <div id="spindleNotifSlot" class="spindle-notif-slot"></div>

                <!-- Login + Sign Up displayed (no token)-->
                <a href="home.html?login=1&return=marketplace.html" class="btn-navbar-login d-none" id="loginButton">Log In</a>
                <a href="home.html?login=1&return=marketplace.html" class="btn-navbar-signup d-none" id="registerButton">Sign Up</a>

                <!-- Profile + Logout displayed (token)-->
                <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
                <button class="btn-navbar-logout d-none" id="logoutButton">Log Out</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="sidebar-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="groups.html" class="sidebar-item">
                <i class="fas fa-users"></i>
                <span>Study Groups</span>
            </a>
            <a href="marketplace.html" class="sidebar-item active">
                <i class="fas fa-store"></i>
                <span>Marketplace</span>
            </a>
            <a href="profile.html" class="sidebar-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>

            <div class="sidebar-divider"></div>

            <a href="saved.html" class="sidebar-item">
                <i class="fas fa-bookmark"></i>
                <span>Saved Posts</span>
            </a>
            <a href="index.html" class="sidebar-item">
                <i class="fas fa-clock"></i>
                <span>Recent</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>

            <div class="sidebar-divider"></div>

            <h6 class="px-3 mt-3 mb-2 text-muted" style="font-size: 0.85rem; font-weight: 600;">YOUR GROUPS</h6>
            <div id="yourGroupsContainer"></div>
        </aside>

        <main id="content-area">
            <!-- Header-->
            <header class="bg-dark py-5">
                <div class="container px-4 px-lg-5 my-5">
                    <div class="text-center text-white">
                        <h1 class="display-4 fw-bolder">SP Marketplace</h1>
                        <p class="lead fw-normal text-white-50 mb-0">Shop to your heart's content</p>
                    </div>
                </div>
            </header>
            <!-- Section-->
            <section class="py-5">
                <div class="container px-4 px-lg-5 mt-5">
                    <div id="listings-container" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center"></div>
                </div>
            </section>
            <!-- Footer-->
            <footer class="py-5 bg-dark">
                <div class="container">
                    <p class="m-0 text-center text-white">Copyright &copy; Spindle 2026</p>
                </div>
            </footer>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addedToCartModal" tabindex="-1" role="dialog" aria-labelledby="addedToCartModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addedToCartModalLabel">Item Added to Cart Successfully!</h5>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/queryCmds.js"></script>
    <script src="js/getCurrentURL.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/addItemToCart.js"></script>
    <script src="js/insertMarketplaceItems.js"></script>
</body>
</html>
