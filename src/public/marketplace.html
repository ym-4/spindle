<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/marketplace.css">
    <title>Marketplace</title>
  </head>
  <body>
    <div>
      <body>
        <!-- Navigation-->
        <nav class="navbar">
          <div class="container-fluid px-4 d-flex align-items-center">
            <!-- Brand (left) -->
            <a class="navbar-brand" href="index.html">
              <img src="" alt="Spindle Logo" class="brand-logo" />
              <span class="brand-name">spindle</span>
            </a>

            <div class="navbar-right">

              <!-- Cart -->
              <a href="cart.html" class="btn-navbar-login" title="Cart">Cart</a>

              <!-- View Listings -->
              <a href="my_listings.html" class="btn-navbar-login" title="My Listings">My Listings</a>

              <!-- Create New Listing -->
              <a href="create_listing.html" class="btn-navbar-login" title="New Listing"><i class="fas fa-plus"></i> New Listing</a>

              <!-- Notification bell — always visible -->
              <a href="#" class="notif-bell" title="Notifications">
                <i class="fas fa-bell"></i>
              </a>

              <!-- Login + Sign Up displayed (no token)-->
              <a href="login.html" class="btn-navbar-login d-none" id="loginButton">Log In</a>
              <a href="register.html" class="btn-navbar-signup d-none" id="registerButton"
                >Sign Up</a
              >

              <!-- Profile + Logout displayed (token)-->
              <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
                <i class="fas fa-user-circle"></i> Profile
              </a>
              <button class="btn-navbar-logout d-none" id="logoutButton">Log Out</button>
            </div>
          </div>
        </nav>
        <!-- Header-->
        <header class="bg-dark py-5">
          <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
              <h1 class="display-4 fw-bolder">SP Marketplace</h1>
              <p class="lead fw-normal text-white-50 mb-0">Shop to your heart's content</p>
            </div>
          </div>
        </header>
        <!-- Section-->
        <section class="py-5">
          <div class="container px-4 px-lg-5 mt-5">
            <div
              id="listings-container"
              class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center"
            ></div>
          </div>
        </section>
      </body>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="addedToCartModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="addedToCartModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addedToCartModalLabel">Item Added to Cart Successfully!</h5>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/userNavBarToggle.js" type="text/javascript"></script>
    <script src="js/insertMarketplaceItems.js" type="text/javascript"></script>
    <script src="js/cartFunctions.js"></script>
  </body>
</html>
