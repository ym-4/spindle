<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Marketplace</title>

    <!-- CSS -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/temp.css" />
    <link rel="stylesheet" href="css/marketplace.css" />
    <link rel="stylesheet" href="css/marketplace-cards.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link rel="stylesheet" href="css/profile-page.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/wa-nav.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        updateNavForUser(getStoredUser());
        syncLegacyNavbar();
      });
    </script>
  </head>

  <body class="" data-page="marketplace">
    <!-- Navigation-->
    <nav class="navbar">
      <div class="container-fluid px-4 d-flex align-items-center">
        <!-- Brand (left) -->
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>

        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>  
                <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
                <a href="home.html?login=1&tab=login&return=marketplace.html" class="btn-navbar-login" id="loginButton">Log In</a>
                <a href="home.html?login=1&tab=register&return=marketplace.html" class="btn-navbar-signup" id="registerButton">Sign Up</a>
                <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
                <button class="btn-navbar-logout d-none" id="logoutButton" type="button">Log Out</button>
            </div>
          <a href="cart.html" class="btn-navbar-login">Cart</a>
          <a href="create_listing.html" class="btn-navbar-login">+New Listing</a>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Left Sidebar -->
      <aside class="sidebar"></aside>

      <main id="content-area">
        <!-- Header-->
        <header class="bg-dark py-5">
          <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
              <h1 class="display-4 fw-bolder">SP Marketplace</h1>
              <p class="lead fw-normal text-white-50 mb-0">Shop to your heart's content</p>
            </div>
          </div>
        </header>

        <!-- Section-->
        <section class="py-5">
          <div class="container px-4 px-lg-5 mt-5">
            <!-- Action Buttons -->
            <div class="d-flex justify-content-end gap-2 mb-4">
              <a href="marketplace.html" class="btn btn-outline-dark">
                <i class="fas fa-store"></i> Marketplace
              </a>
              <a href="cart.html" class="btn btn-outline-dark">
                <i class="fas fa-shopping-cart"></i> Cart
              </a>
              <a href="create_listing.html" class="btn btn-outline-dark">
                <i class="fas fa-plus-circle"></i> Add Listing
              </a>
              <a href="my_listings.html" class="btn btn-outline-dark">
                <i class="fas fa-list"></i> My Listings
              </a>
            </div>

            <!-- Search Bar -->
            <div class="input-group mb-2">
              <span class="input-group-text bg-white border-end-0">
                <i class="fas fa-search"></i>
              </span>
              <input
                type="text"
                id="marketplaceSearch"
                class="form-control border-start-0"
                placeholder="Search listings..."
              />
            </div>

            <!-- Listing Container -->
            <div id="no-listings-state" class="no-listings-state d-none">
              <i class="fas fa-box-open no-listings-icon"></i>
              <h4>No listings matched your search</h4>
              <p class="text-muted">Be the first to list that item in the marketplace!</p>
              <a href="create_listing.html" class="btn btn-outline-dark">
                <i class="fas fa-plus-circle"></i> Add a Listing
              </a>
            </div>
            <div id="listings-container" class="listings-grid"></div>

            <!-- Pagination -->
            <nav id="pagination-nav" aria-label="Marketplace pagination" class="mt-4">
              <ul class="pagination justify-content-center" id="pagination-controls">
                <li class="page-item" id="prev-page-item">
                  <button class="page-link" id="prev-page-btn" aria-label="Previous">
                    <i class="fas fa-chevron-left"></i>
                  </button>
                </li>
                <li class="page-item" id="next-page-item">
                  <button class="page-link" id="next-page-btn" aria-label="Next">
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </li>
              </ul>
            </nav>
          </div>
        </section>
      </main>
    </div>

    <!-- Item Added to Cart Modal -->
    <div
      class="modal fade"
      id="addedToCartModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="addedToCartModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addedToCartModalLabel">Item Added to Cart Successfully!</h5>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/insertMarketplaceItems.js" type="text/javascript"></script>
    <script src="js/cartFunctions.js"></script>
    <script src="js/searchBar-Marketplace.js"></script>
    <script src="js/api.js"></script>
    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (typeof injectNotificationsOnly === 'function') {
          injectNotificationsOnly('spindleNotifSlot');
        }
      });
    </script>
  </body>
</html>
