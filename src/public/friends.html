<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends — Spindle</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap"
      rel="stylesheet"
    />

    <script src="js/api.js"></script>
  </head>
  <body data-page="friends">
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton"
            ><i class="fas fa-user-circle"></i> Profile</a
          >
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>
      <main class="content-area">
        <div class="d-flex align-items-center gap-2 mb-2">
          <h1 class="h4 mb-0">Friends</h1>
        </div>

        <!-- Tab bar -->
        <div class="friends-page-tabs" id="friendsTabs">
          <button class="friends-page-tab active" data-friend-tab="online">
            <i
              class="fas fa-circle"
              style="color: #22c55e; font-size: 0.55rem; vertical-align: middle; margin-right: 4px"
            ></i>
            Online
          </button>
          <button class="friends-page-tab" data-friend-tab="all">
            <i class="fas fa-users"></i> All Friends
            <span class="friends-page-tab-badge" id="allFriendsBadge">0</span>
          </button>
          <button class="friends-page-tab" data-friend-tab="pending">
            <i class="fas fa-clock"></i> Pending
            <span class="friends-page-tab-badge" id="pendingBadge">0</span>
          </button>
          <button class="friends-page-tab" data-friend-tab="blocked">
            <i class="fas fa-ban"></i> Blocked
          </button>
          <button class="friends-page-tab" data-friend-tab="add">
            <i class="fas fa-user-plus"></i> Add Friend
          </button>
        </div>

        <!-- Online tab -->
        <div class="friend-tab-panel" id="tabOnline">
          <p class="text-muted small mb-2"><i class="fas fa-wifi"></i> Friends currently online</p>
          <div id="onlineFriendsList"></div>
        </div>

        <!-- All Friends tab -->
        <div class="friend-tab-panel d-none" id="tabAll">
          <div class="d-flex align-items-center gap-2 mb-2">
            <input
              type="search"
              id="allFriendsSearch"
              class="friends-search-box"
              placeholder="Filter friends…"
              style="margin-bottom: 0"
            />
            <select class="friends-sort-select" id="friendsSort">
              <option value="">Favorites first</option>
              <option value="recent">Recently added</option>
              <option value="name">Alphabetical A-Z</option>
              <option value="group">By shared groups</option>
            </select>
          </div>
          <div id="allFriendsList"></div>
        </div>

        <!-- Pending tab -->
        <div class="friend-tab-panel d-none" id="tabPending">
          <div class="friends-sub-tabs">
            <button class="friends-sub-tab active" data-pending-tab="received">Received</button>
            <button class="friends-sub-tab" data-pending-tab="sent">Sent</button>
          </div>
          <div id="pendingRequestsList"></div>
        </div>

        <!-- Blocked tab -->
        <div class="friend-tab-panel d-none" id="tabBlocked">
          <p class="text-muted small mb-2"><i class="fas fa-ban"></i> Users you've blocked</p>
          <div id="blockedUsersList"></div>
        </div>

        <!-- Add Friend tab -->
        <div class="friend-tab-panel d-none" id="tabAdd">
          <input
            type="search"
            id="friendSearch"
            class="friends-search-box"
            placeholder="Search by name or email…"
            autocomplete="off"
          />
          <div id="searchResults"></div>

          <h5 class="mt-4 mb-2"><i class="fas fa-lightbulb"></i> Suggested</h5>
          <p class="text-muted small">People in your study groups</p>
          <div id="suggestedFriends" class="suggested-grid"></div>
        </div>
      </main>
    </div>

    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/friends-page.js"></script>
  </body>
</html>
