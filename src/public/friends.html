<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends — Spindle</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap"
      rel="stylesheet"
    />

    <script src="js/api.js"></script>
  </head>
  <body data-page="friends">
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton"
            ><i class="fas fa-user-circle"></i>
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>
      <main class="content-area">
        <h1 class="h4 mb-3">Friends</h1>
        <p class="text-muted small mb-3">
          Find people, manage requests. New friends appear in <a href="chat.html">Chats</a>.
        </p>

        <div class="card mb-3">
          <div class="card-body">
            <label class="form-label fw-semibold">Find people</label>
            <input
              type="search"
              id="friendSearch"
              class="form-control"
              placeholder="Search by name or email…"
              autocomplete="off"
            />
            <p id="friendSearchHint" class="small text-muted mt-2 mb-0">
              Click a name to view their profile, or tap Add to send a request.
            </p>
            <ul id="findPeopleList" class="list-group list-group-flush mt-2"></ul>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="d-flex gap-3 border-bottom pb-2 mb-2">
              <button
                type="button"
                class="btn btn-link p-0 text-decoration-none fw-semibold friend-tab active"
                data-req-tab="received"
              >
                Received
              </button>
              <button
                type="button"
                class="btn btn-link p-0 text-decoration-none text-muted friend-tab"
                data-req-tab="sent"
              >
                Sent
              </button>
            </div>
            <ul id="friendRequestsList" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </main>
    </div>

    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/friends-page.js"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
  </body>
</html>
