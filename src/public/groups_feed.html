<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/posts.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- JS files -->
    <script src="js/queryCmds.js"></script>
    <script src="/js/userNavBarToggle.js"></script>

    <title>Document</title>
</head>
<body>
    <!---Navbar-->
    <nav class="navbar">
        <div class="container-fluid px-4 d-flex align-items-center">

            <!-- Brand (left) -->
            <a class="navbar-brand" href="index.html">
                <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo">
                <span class="brand-name">spindle</span>
            </a>

            <!-- Searchbar-->
            <div class="navbar-search">
                <input class="form-control" id="searchInput" type="search" 
                    placeholder="Search posts, groups, items..." aria-label="Search">
            </div>

            
            <div class="navbar-right">
                <!-- Notification bell — always visible -->
                <a href="#" class="notif-bell" title="Notifications">
                    <i class="fas fa-bell"></i>
                </a>

                <!-- Login + Sign Up displayed (no token)-->
                <a href="login.html" class="btn-navbar-login d-none" id="loginButton">Log In</a>
                <a href="register.html" class="btn-navbar-signup d-none" id="registerButton">Sign Up</a>

                <!-- Profile + Logout displayed (token)-->
                <a href="profile.html" class="btn-navbar-profile d-none" id="profileButton">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
                <button class="btn-navbar-logout d-none" id="logoutButton">Log Out</button>
            </div>

        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="sidebar-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="groups.html" class="sidebar-item active">
                <i class="fas fa-users"></i>
                <span>Study Groups</span>
            </a>
            <a href="marketplace.html" class="sidebar-item">
                <i class="fas fa-store"></i>
                <span>Marketplace</span>
            </a>
            <a href="profile.html" class="sidebar-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
            
            <div class="sidebar-divider"></div>
            
            <div class="sidebar-item">
                <i class="fas fa-bookmark"></i>
                <span>Saved Posts</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-clock"></i>
                <span>Recent</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </div>
            
            <div class="sidebar-divider"></div>
            
            <h6 class="px-3 mt-3 mb-2 text-muted" style="font-size: 0.85rem; font-weight: 600;">YOUR GROUPS</h6>
            <div class="sidebar-item">
                <i class="fas fa-circle" style="font-size: 0.5rem; color: #42b72a;"></i>
                <span>CS101 Study Group</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-circle" style="font-size: 0.5rem; color: #1877f2;"></i>
                <span>Math Assignment Help</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-plus-circle"></i>
                <span>See all groups</span>
            </div>
        </aside>

        <main id="content-area">

        </main>
    </div>
    
</body>
</html>
