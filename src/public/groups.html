<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS files -->
    <link rel="stylesheet" href="css/groups.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Fonts -->

    <title>Groups</title>
</head>

<body>
    <!-- Copy navbar over from home page -->


    <div class="map-container">
        <div class="map">
            <!-- Map -->
            <img class="map-bg" src="images/Groups_TEMP_Map.png" alt="Map">

            <!-- SOC -->
            <div class="school soc">
                <img class="img-sizing-large img-school" src="images/Groups_SOC_Building.png" alt="SOC Building">

                <button class="btn-style btn-indigo">
                    SCHOOL OF COMPUTING
                    <br><strong>SOC</strong>
                </button>
            </div>
            
            
            <!-- ABE -->
            <div class="school abe">
                <img class="img-sizing img-school" src="images/Groups_ABE_Building.png" alt="ABE Building">

                <button class="btn-style btn-red">
                    SCHOOL OF ARCHITECTURE <br>
                    AND THE BUILT ENVIRONMENT  
                    <br><strong>ABE</strong>
                </button>
            </div>

            
            <!-- SB -->
            <div class="school sb">
                <img class="img-sizing-small img-school" src="images/Groups_SB_Building.png" alt="SB Building">

                <button class="btn-style btn-orange">
                    SCHOOL OF BUSINESS
                    <br><strong>SB</strong>
                </button>
            </div>


            <!-- EEE -->
            <div class="school eee">
                <img class="img-sizing img-school" src="images/Groups_EEE_Building.png" alt="EEE Building">

                <button class="btn-style btn-yellow">
                    SCHOOL OF ELECTRICAL AND <br>

                </button>
            </div>


            <!-- SMA -->
            <div class="school sma">
                <img class="img-sizing img-school" src="images/Groups_SMA_Building.png" alt="SMA Building">

                    <br><strong>SMA</strong>
                </button>
            </div>


            <!-- MAE -->
            <div class="school mae">
                <img class="img-sizing img-school" src="images/Groups_MAE_Building.png" alt="MAE Building">

                <button class="btn-style btn-blue">
                    SCHOOL OF MECHANICAL & <br>

                    <br><strong>MAE</strong>
                </button>
            </div>


            <!-- CLS -->
            <div class="school cls">
                <img class="img-sizing-large img-school" src="images/Groups_CLS_Building.png" alt="CLS Building">

                <button class="btn-style btn-purple">
                    SCHOOL OF CHEMICAL <br>
                    AND LIFE SCIENCES
                    <br><strong>CLS</strong>
                </button>
            </div>


            <!-- MAD -->
            <div class="school mad">
                <!-- Image not completed yet -->

                    ARTS & DESIGN
