<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="css/whiteboard.css" />
    <script src="js/queryCmds.js"></script>
    <script src="js/whiteboard.js" defer></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="toolbar">
      <!-- Back button -->
      <a href="groups_feed.html" class="back-btn" id="back">
        <i class="bi bi-arrow-left"></i>
        Back
      </a>

      <!-- Mode -->
      <div class="group">
        <button id="whiteboardBtn" class="active-mode">Whiteboard</button>
        <button id="pixelBtn">Pixel Art</button>
      </div>

      <!-- Drawing -->
      <div class="group">
        <div class="control">
          <label>Tool</label>
          <select id="shapeTool">
            <option value="freehand">Freehand</option>
            <option value="line">Line</option>
            <option value="rectangle">Rectangle</option>
            <option value="circle">Circle</option>
          </select>
        </div>

        <div class="control">
          <label>Brush</label>
          <select id="brushTool">
            <option value="pen">Pen</option>
            <option value="marker">Marker</option>
            <option value="pencil">Pencil</option>
          </select>
        </div>

        <div class="control">
          <label>Color</label>
          <input type="color" id="stroke" />
        </div>

        <div class="control">
          <label>Size</label>
          <input type="range" id="lineWidth" min="1" max="50" value="5" />
        </div>

        <div class="control">
          <label>Opacity</label>
          <input type="range" id="opacity" min="0" max="1" step="0.05" value="1" />
        </div>
      </div>

      <!-- Edit -->
      <div class="group">
        <button id="undo">↶</button>
        <button id="redo">↷</button>
        <button id="eraser">🩹</button>
        <button id="clear">🗑</button>
      </div>

      <!-- View -->
      <div class="group">
        <button id="zoomOut">−</button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn">+</button>
      </div>

      <!-- File -->
      <div class="group right">
        <button id="save">💾 Save</button>
        <button id="fullscreen">⛶</button>
      </div>
    </div>

    <div id="canvasContainer">
      <canvas id="drawing-board"></canvas>
      <canvas id="pixel-board" style="display: none"></canvas>
    </div>
  </body>
</html>
