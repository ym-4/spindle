<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search - Spindle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link rel="stylesheet" href="/css/posts.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="./images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-search position-relative">
          <input
            class="form-control"
            id="searchInput"
            type="search"
            placeholder="Search"
            aria-label="Search"
            autocomplete="off"
          />
          <span class="search-placeholder-fake" aria-hidden="true"
            >Search posts, groups, items...</span
          >
          <div id="searchDropdown" class="search-dropdown" style="display: none"></div>
        </div>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>

      <main class="content-area">
        <!-- Back + filter row -->
        <div class="mb-3">
          <a href="javascript:history.back()" class="btn btn-link text-decoration-none px-0">
            <i class="fas fa-arrow-left"></i> Back to Feed
          </a>
        </div>

        <!-- Filter bar -->
        <div class="card mb-3" id="searchFilterCard">
          <div class="card-body py-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span class="search-filter-label me-1">
                <i class="fas fa-filter me-1"></i>Filter:
              </span>
              <div class="dropdown" id="categoryFilterDropdown">
                <button
                  class="btn btn-sm search-category-btn dropdown-toggle"
                  type="button"
                  id="categoryFilterBtn"
                  data-bs-toggle="dropdown"
                  data-bs-auto-close="outside"
                  aria-expanded="false"
                >
                  <i class="fas fa-layer-group me-1"></i>
                  <span id="categoryFilterLabel">All categories</span>
                </button>
                <div
                  class="dropdown-menu p-2"
                  id="categoryFilterMenu"
                  style="min-width: 220px; max-height: 280px; overflow-y: auto"
                >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="confession" />
                    Confession</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="qna" />
                    Q&amp;A</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="general" />
                    General</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="events" />
                    Events</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="news" />
                    News</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="cca" />
                    CCA</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="internship" />
                    Internship</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="SOC" />
                    SOC</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="ABE" />
                    ABE</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="SB" /> SB</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="CLS" />
                    CLS</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="EEE" />
                    EEE</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="MAD" />
                    MAD</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="MAE" />
                    MAE</label
                  >
                  <label class="dropdown-item d-flex align-items-center gap-2"
                    ><input type="checkbox" class="search-category-checkbox" value="SMA" />
                    SMA</label
                  >
                </div>
              </div>
              <select class="form-select form-select-sm" id="searchSort" style="width: auto">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="relevance">Relevance</option>
              </select>
              <div class="d-flex align-items-center gap-1">
                <label
                  for="searchDateFrom"
                  class="search-filter-label mb-0"
                  style="font-weight: 600"
                  >From:</label
                >
                <input
                  type="date"
                  class="form-control form-control-sm"
                  id="searchDateFrom"
                  style="width: auto"
                />
              </div>
              <div class="d-flex align-items-center gap-1">
                <label for="searchDateTo" class="search-filter-label mb-0" style="font-weight: 600"
                  >To:</label
                >
                <input
                  type="date"
                  class="form-control form-control-sm"
                  id="searchDateTo"
                  style="width: auto"
                />
              </div>
              <button class="btn btn-sm btn-outline-secondary" id="clearSearchFiltersBtn">
                <i class="fas fa-times me-1"></i>Clear
              </button>
            </div>
          </div>
        </div>

        <!-- Results -->
        <div id="searchResultsPanel"></div>
      </main>

      <aside class="right-sidebar">
        <div class="card">
          <div class="card-header"><i class="fas fa-fire text-danger me-2"></i>Hot Posts</div>
          <div class="list-group list-group-flush" id="top5Container">
            <div class="list-group-item text-muted small text-center py-3">
              <div class="spinner-border spinner-border-sm" role="status"></div>
            </div>
          </div>
        </div>

        <!-- community guidelines -->
        <div class="card mt-3">
          <div class="card-header">Community Guidelines</div>
          <div class="card-body">
            <p class="small mb-2">✓ Be respectful and kind</p>
            <p class="small mb-2">✓ No harassment or hate speech</p>
            <p class="small mb-2">✓ Keep discussions on topic</p>
            <p class="small mb-0">✓ Report inappropriate content</p>
          </div>
        </div>

        <!-- quick links-->
        <div class="card mt-3">
          <div class="card-header">Quick Links</div>
          <div class="list-group list-group-flush">
            <a href="#" id="helpCenterLink" class="list-group-item list-group-item-action">
              <i class="fas fa-question-circle me-2"></i>
              Help Center
            </a>
            <a href="#" id="privacyLink" class="list-group-item list-group-item-action">
              <i class="fas fa-shield-alt me-2"></i>
              Privacy
            </a>
            <a href="#" id="guidelinesLink" class="list-group-item list-group-item-action">
              <i class="fas fa-book me-2"></i>
              Guidelines
            </a>
          </div>
        </div>
      </aside>
    </div>

    <!-- Quick Links Modal -->
    <div class="modal fade" id="infoModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="infoModalTitle">Information</h5>

            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body" id="infoModalBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/quickLinks.js"></script>
    <script src="/js/queryCmds.js"></script>
    <script src="/js/getCurrentURL.js"></script>
    <script src="js/api.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="/js/search.js"></script>
  </body>
</html>
