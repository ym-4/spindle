<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats — Spindle</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/posts.css" />
    <link rel="stylesheet" href="css/wa.css" />
    <link rel="stylesheet" href="css/chat-spindle.css" />
    <link rel="stylesheet" href="css/spindle-notif.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap"
      rel="stylesheet"
    />

    <script src="js/api.js"></script>
  </head>
  <body class="spindle-chat-page" data-page="chat">
    <nav class="navbar">
      <div class="container-fluid px-0 d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/Logo_Panda.png" alt="Spindle Logo" class="brand-logo" />
          <span class="brand-name">spindle</span>
        </a>
        <div class="navbar-right">
          <div id="spindleNotifSlot" class="spindle-notif-slot"></div>
          <a href="profile.html" class="btn-navbar-profile" id="profileButton">
            <i class="fas fa-user-circle"></i> Profile
          </a>
          <button class="btn-navbar-logout" id="logoutButton" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar"></aside>

      <main class="content-area">
        <div class="wa-chat-shell">
          <aside class="wa-sidebar" id="chatSidebar">
            <div class="wa-sidebar-tabs">
              <button type="button" data-side="chats" class="active">Chats</button>
              <button type="button" data-side="calls">Calls</button>
            </div>
            <div id="panelChats" class="wa-side-panel is-active">
              <ul id="chatContactList" class="wa-list"></ul>
            </div>
            <div id="panelCalls" class="wa-side-panel">
              <p class="wa-side-label">Call history</p>
              <ul id="callLogList" class="wa-list wa-list--section"></ul>
            </div>
          </aside>
          <section class="wa-main" id="chatMain">
            <div id="chatEmpty" class="wa-empty-state">
              <p>Select a friend to start chatting</p>
              <p class="wa-empty-state__hint">Add friends in the Friends tab first</p>
            </div>
            <div id="chatActive" class="wa-chat-active">
              <div class="wa-chat-header">
                <button
                  type="button"
                  class="wa-icon-btn wa-back-btn"
                  id="btnBackToContacts"
                  title="Back"
                >
                  <i class="fas fa-arrow-left"></i>
                </button>
                <div id="chatHeaderAvatar" class="wa-avatar" style="cursor: pointer"></div>
                <div class="wa-chat-header__name" style="cursor: pointer" id="chatHeaderNameWrap">
                  <strong id="chatHeaderName"></strong>
                  <span id="chatHeaderStatus" class="wa-header-status"></span>
                </div>
                <div id="chatSearchBar" class="wa-header-search d-none">
                  <input
                    type="text"
                    id="chatSearchInput"
                    placeholder="Search messages…"
                    autocomplete="off"
                  />
                  <span id="chatSearchCount" class="wa-header-search-count"></span>
                  <button
                    type="button"
                    class="wa-icon-btn"
                    id="btnCloseSearch"
                    title="Close search"
                  >
                    <i class="fas fa-times"></i>
                  </button>
                </div>
                <button type="button" class="wa-icon-btn" id="btnToggleSearch" title="Search">
                  <i class="fas fa-search"></i>
                </button>
                <button type="button" class="wa-icon-btn" id="btnVoiceCall" title="Voice call">
                  <i class="fas fa-phone"></i>
                </button>
                <button type="button" class="wa-icon-btn" id="btnVideoCall" title="Video call">
                  <i class="fas fa-video"></i>
                </button>
                <div class="wa-header-menu-wrap">
                  <button type="button" class="wa-icon-btn" id="btnChatMenu" title="More">
                    <i class="fas fa-ellipsis-v"></i>
                  </button>
                  <div id="chatDropdownMenu" class="wa-dropdown-menu hidden">
                    <button type="button" data-action="mute">
                      <i class="fas fa-bell-slash"></i> Mute
                    </button>
                    <button type="button" data-action="unmute" class="hidden">
                      <i class="fas fa-bell"></i> Unmute
                    </button>
                    <button type="button" data-action="pin">
                      <i class="fas fa-thumbtack"></i> Pin chat
                    </button>
                    <button type="button" data-action="unpin" class="hidden">
                      <i class="fas fa-thumbtack"></i> Unpin chat
                    </button>
                    <button type="button" data-action="wallpaper">
                      <i class="fas fa-image"></i> Chat wallpaper
                    </button>
                    <button type="button" data-action="block">
                      <i class="fas fa-ban"></i> Block
                    </button>
                    <button type="button" data-action="clear" class="text-danger">
                      <i class="fas fa-trash"></i> Clear chat
                    </button>
                  </div>
                </div>
              </div>
              <div id="chatTypingIndicator" class="wa-typing-indicator hidden">
                <span id="typingName"></span> is typing<span class="wa-typing-dots"
                  ><span>.</span><span>.</span><span>.</span></span
                >
              </div>
              <div id="replyPreview" class="wa-reply-preview hidden">
                <div class="wa-reply-preview__body">
                  <strong>Replying</strong>
                  <span id="replyPreviewText"></span>
                </div>
                <button type="button" class="wa-icon-btn" id="cancelReply" title="Cancel reply">
                  <i class="fas fa-times"></i>
                </button>
              </div>
              <div id="chatMessages" class="wa-messages"></div>
              <form id="chatForm" class="wa-compose">
                <label for="chatImageInput" class="wa-attach-btn" title="Attach image">
                  <i class="fas fa-paperclip"></i>
                </label>
                <input type="file" id="chatImageInput" accept="image/*" style="display: none" />
                <input
                  type="text"
                  id="chatInput"
                  placeholder="Type a message"
                  maxlength="2000"
                  autocomplete="off"
                />
                <button type="submit" class="wa-send-btn" id="btnSend" title="Send">
                  <i class="fas fa-paper-plane"></i>
                </button>
              </form>
              <div id="chatImagePreview" class="wa-image-preview hidden">
                <img id="chatImagePreviewImg" alt="Preview" />
                <button type="button" class="wa-icon-btn" id="cancelImagePreview" title="Remove">
                  <i class="fas fa-times-circle"></i>
                </button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="callOverlay" class="wa-call-overlay hidden">
      <div class="wa-call-card">
        <p id="callStatus" class="wa-call-status">Connecting…</p>
        <p id="callSubstatus" class="wa-call-substatus"></p>
        <div id="callVideoWrap" class="wa-call-videos hidden">
          <video id="localVideo" autoplay muted playsinline class="wa-call-local"></video>
          <video id="remoteVideo" autoplay playsinline class="wa-call-remote"></video>
          <video id="screenShareVideo" autoplay playsinline class="wa-call-remote hidden"></video>
        </div>
        <div id="callIncomingActions" class="wa-call-actions hidden">
          <button
            type="button"
            class="wa-call-btn wa-call-btn--decline"
            id="btnDeclineCall"
            title="Decline"
          >
            ✕
          </button>
          <button
            type="button"
            class="wa-call-btn wa-call-btn--accept"
            id="btnAcceptCall"
            title="Accept"
          >
            📞
          </button>
        </div>
        <div id="callActiveControls" class="wa-call-controls hidden">
          <button type="button" class="wa-call-ctrl" id="btnMute" title="Mute">🎤</button>
          <button type="button" class="wa-call-ctrl" id="btnToggleVideo" title="Camera">📹</button>
          <button type="button" class="wa-call-ctrl" id="btnScreenShare" title="Share screen">
            🖥️
          </button>
          <button type="button" class="wa-call-ctrl wa-call-ctrl--end" id="btnEndCall" title="End">
            📵
          </button>
        </div>
        <div id="callEndedActions" class="wa-call-ended hidden">
          <button type="button" class="wa-btn wa-btn--ghost" id="btnCallDismiss">Dismiss</button>
          <button type="button" class="wa-btn" id="btnCallBack">Call back</button>
        </div>
        <button type="button" class="wa-btn wa-btn--ghost hidden" id="btnCancelRinging">
          Cancel
        </button>
      </div>
    </div>

    <div id="wallpaperPicker" class="wa-wallpaper-picker hidden">
      <div class="wa-wallpaper-picker__backdrop"></div>
      <div class="wa-wallpaper-picker__panel">
        <h5>Chat Wallpaper</h5>
        <div class="wa-wallpaper-grid">
          <button
            class="wa-wallpaper-opt"
            data-wallpaper="default"
            title="Default pattern"
            style="background: var(--wa-bg); background-image: var(--wa-bg-pattern)"
          ></button>
          <button
            class="wa-wallpaper-opt"
            data-wallpaper="solid-light"
            title="Solid light"
            style="background: #e8e4db"
          ></button>
          <button
            class="wa-wallpaper-opt"
            data-wallpaper="solid-dark"
            title="Solid dark"
            style="background: #0b141a"
          ></button>
          <button
            class="wa-wallpaper-opt"
            data-wallpaper="leaves"
            title="Leaves"
            style="background: #1a3a2a"
          ></button>
          <button
            class="wa-wallpaper-opt"
            data-wallpaper="ocean"
            title="Ocean"
            style="background: #0a2e4a"
          ></button>
          <button
            class="wa-wallpaper-opt"
            data-wallpaper="sunset"
            title="Sunset"
            style="background: #3a1a1a"
          ></button>
        </div>
        <button class="wa-btn wa-btn--ghost" id="wallpaperPickerClose">Close</button>
      </div>
    </div>

    <div id="msgMenu" class="wa-msg-menu hidden" role="menu">
      <button type="button" data-action="copy">Copy</button>
      <button type="button" data-action="edit">Edit</button>
      <button type="button" data-action="delete">Delete</button>
      <div class="wa-msg-emoji-bar">
        <button type="button" data-emoji="❤️">❤️</button>
        <button type="button" data-emoji="😂">😂</button>
        <button type="button" data-emoji="😮">😮</button>
        <button type="button" data-emoji="😢">😢</button>
        <button type="button" data-emoji="🙏">🙏</button>
      </div>
    </div>

    <script src="js/wa-nav.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="js/userNavBarToggle.js"></script>
    <script src="js/spindle-sidebar.js"></script>
    <script src="js/spindle-page.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
  </body>
</html>
